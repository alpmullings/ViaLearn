<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ViaLearn</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Arial, Helvetica, sans-serif;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #f4f7fb;
        color: #1f2933;
      }

      main {
        width: min(680px, calc(100% - 3rem));
        padding: 3rem;
        border-radius: 1rem;
        background: #ffffff;
        box-shadow: 0 18px 40px rgba(31, 41, 51, 0.12);
      }

      h1 {
        margin-top: 0;
        font-size: clamp(2rem, 4vw, 3rem);
      }

      p {
        line-height: 1.6;
        margin-bottom: 0;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>ViaLearn</h1>
      <p>
        ViaLearn will be hosted on Netlify first, with the production custom
        domain connected later when the existing domain is ready to transfer.
      </p>
    </main>
  </body>
</html>
